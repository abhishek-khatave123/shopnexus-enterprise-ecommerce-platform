
services:
  postgres:
    image: postgres:16-alpine
    container_name: shopnexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopnexus
      POSTGRES_PASSWORD: shopnexus
      POSTGRES_DB: shopnexus
    ports:
      - "5432:5432"
    volumes:
      - shopnexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shopnexus -d shopnexus" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: shopnexus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://shopnexus:shopnexus@postgres:5432/shopnexus
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: development

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    container_name: shopnexus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  shopnexus_postgres_data:
